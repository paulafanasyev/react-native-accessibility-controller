name: Build and vendor lib

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify package manager inputs
        run: |
          test -f package.json
          test -f package-lock.json
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify generated entrypoint
        run: |
          test -f lib/commonjs/index.js
          node -e "const p=require('./package.json'); const fs=require('fs'); if(p.main!=='lib/commonjs/index.js') throw new Error('Unexpected main: '+p.main); if(!fs.existsSync(p.main)) throw new Error('Missing main: '+p.main); console.log('Verified '+p.main)"

      - name: Vendor generated lib
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lib
          if git diff --cached --quiet; then
            echo "lib already up to date"
            exit 0
          fi
          git commit -m "build: vendor compiled lib artifacts"
          git push origin HEAD:main
